<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><g clip-path="url(#SvgjsClipPath1909)"><rect width="1000" height="1000" fill="#1c1d21"></rect><g transform="matrix(0.4032258064516129,0,0,0.4032258064516129,0,0)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5120 5120" width="2480" height="2480"><defs>
    <!-- Плавный и глубокий графитный линейный градиент без пересвета -->
    <linearGradient id="button-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222327"></stop>
      <stop offset="50%" stop-color="#151619"></stop>
      <stop offset="100%" stop-color="#0a0a0c"></stop>
    </linearGradient>

    <!-- Сбалансированная, ультра-гладкая фаска с мягким переливом по краям -->
    <linearGradient id="bevel-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5b69b" stop-opacity="0.55"></stop>
      <stop offset="30%" stop-color="#6e624f" stop-opacity="0.25"></stop>
      <stop offset="50%" stop-color="#1c1d21" stop-opacity="0.7"></stop>
      <stop offset="70%" stop-color="#6e624f" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#c5b69b" stop-opacity="0.45"></stop>
    </linearGradient>

    <!-- Глубокая тень для физической высоты кнопки -->
    <filter id="btn-3d-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="90" stdDeviation="100" flood-color="#000000" flood-opacity="0.8"></feDropShadow>
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.5"></feDropShadow>
    </filter>

    <!-- Чистый эффект парения -->
    <filter id="floating-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="45" stdDeviation="35" flood-color="#000000" flood-opacity="0.65"></feDropShadow>
    </filter>

    <!-- Усовершенствованный многоступенчатый градиент настоящего золота с благородными переливами -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaae"></stop>
      <stop offset="25%" stop-color="#dfb664"></stop>
      <stop offset="50%" stop-color="#c5983e"></stop>
      <stop offset="75%" stop-color="#f4e0a4"></stop>
      <stop offset="100%" stop-color="#8c6218"></stop>
    </linearGradient>
  <clipPath id="SvgjsClipPath1909"><rect width="1000" height="1000" x="0" y="0" rx="150" ry="150"></rect></clipPath></defs><rect x="40" y="40" width="5040" height="5040" rx="1120" fill="url(#button-surface)" stroke="url(#bevel-border)" stroke-width="35" filter="url(#btn-3d-shadow)"></rect><line x1="2000" y1="3050" x2="3120" y2="3050" stroke="url(#gold-grad)" stroke-width="18" opacity="0.6" filter="url(#floating-effect)"></line><text x="50%" y="40%" dominant-baseline="central" text-anchor="middle" fill="url(#gold-grad)" font-family="Georgia, 'Times New Roman', serif" font-size="2990" font-weight="300" letter-spacing="70" filter="url(#floating-effect)">BV</text><text x="52%" y="70%" dominant-baseline="central" text-anchor="middle" fill="#c5a059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="700" font-weight="500" letter-spacing="160" opacity="0.9" filter="url(#floating-effect)">JEWELRY</text></svg></g></g></svg>